<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>桌面精灵 · 动作预览</title>
<style>body{font:16px system-ui;margin:36px;color:#253140;background:#f5f2ec}h1{font-size:26px}button,select{padding:10px;margin:5px;border:1px solid #aaa;border-radius:8px}main{display:flex;flex-wrap:wrap;gap:20px}article{text-align:center;padding:18px;border-radius:18px;background:#fff}img{width:320px;height:320px;object-fit:contain;background:repeating-conic-gradient(#d7d9dc 0% 25%,#fff 0% 50%) 50%/24px 24px}body[data-bg="dark"] img{background:#202533}body[data-bg="light"] img{background:white}h2{font-size:18px}p{max-width:850px;line-height:1.6}</style>
<h1>桌面精灵 · 透明循环动作</h1><p>背景只用于检查透明边缘，不包含在动图文件中。观察耳朵、尾巴、围巾是否一致，以及循环接缝处有无跳动。</p><button onclick="document.body.dataset.bg='grid'">棋盘格</button><button onclick="document.body.dataset.bg='light'">浅色</button><button onclick="document.body.dataset.bg='dark'">深色</button><main><article><h2>yawn</h2><img src="yawn.apng" alt="yawn"></article><article><h2>sleep</h2><img src="sleep.apng" alt="sleep"></article><article><h2>eat</h2><img src="eat.apng" alt="eat"></article></main><h2>状态切换测试</h2><select id="state"><option value="yawn">yawn</option><option value="sleep">sleep</option><option value="eat">eat</option></select><br><img id="pet" alt="切换动作"><script>const s=document.getElementById('state'),p=document.getElementById('pet');function update(){p.src=s.value+'.apng'}s.onchange=update;update();</script></html>
